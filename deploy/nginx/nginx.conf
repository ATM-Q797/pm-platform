# ============================================================
# Nginx 主配置 — 反向代理 + 前端静态文件 + HTTPS 预留
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 20m;  # Excel 导入文件上传

    # Gzip 压缩
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 上游：后端 API
    upstream backend_api {
        server backend:8000;
    }

    # ----------------------------------------------------------
    # HTTP → 强制跳转 HTTPS（启用 SSL 后取消注释）
    # ----------------------------------------------------------
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }

    # ----------------------------------------------------------
    # 主站点（HTTP 模式，适合内网 / 开发 / 反代 behind LB）
    # ----------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # 前端静态文件（由 Dockerfile.frontend 复制到 /usr/share/nginx/html）
        root /usr/share/nginx/html;
        index index.html;

        # SPA 路由：所有非 /api 请求返回 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存（Vite 构建产物带 hash，可长期缓存）
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API 反向代理到后端
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（如后续需要）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时：Gantt 等复杂接口可能较慢
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # 健康检查（Nginx 自身）
        location /nginx-health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }

    # ----------------------------------------------------------
    # HTTPS 站点（启用 SSL 后取消注释）
    # ----------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     root /usr/share/nginx/html;
    #     index index.html;
    #
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    #
