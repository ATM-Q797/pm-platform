# ============================================================
# 前端 Nginx 站点配置（由 Dockerfile.frontend 使用）
# 注意：此文件在 Docker 构建时作为默认配置，
#       实际运行时会 nginx.conf 中的 server 块覆盖。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
