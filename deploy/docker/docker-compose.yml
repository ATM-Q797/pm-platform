# ============================================================
# 智能终端研发项目管理平台 — Docker Compose 编排
# ============================================================
# 用法：
#   1. 复制 .env.example 为 .env 并修改配置
#   2. docker compose up -d
#   3. 首次启动需初始化数据库：docker compose exec backend python init_db.py
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL 数据库
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pm_platform}
      POSTGRES_USER: ${POSTGRES_USER:-pm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # 仅在开发时需要暴露到宿主机；生产建议注释掉
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pm_user} -d ${POSTGRES_DB:-pm_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # 后端 API（FastAPI + Gunicorn）
  # ----------------------------------------------------------
  backend:
    image: pm-backend:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pm_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pm_platform}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请设置 JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Cookie Secure 属性：默认 false（配合默认 HTTP 部署）。
      # 启用 HTTPS（nginx SSL server 块）后必须设为 true
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TOKEN_EXPIRE_HOURS: "${TOKEN_EXPIRE_HOURS:-24}"
      WORKERS: "${WORKERS:-4}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-20}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  # ----------------------------------------------------------
  # Nginx 反向代理 + 前端静态文件
  # ----------------------------------------------------------
  nginx:
    image: pm-frontend:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # 主 Nginx 配置（上游定义、SSL、全局设置）
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL 证书（可选，取消注释启用）
      # - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      # - ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - backend

volumes:
  pg_data:
    driver: local
